name: promote-pending-sql

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Clustering commit before the upstream merge (HEAD for pending-only promotion)
        required: true
        default: HEAD
  push:
    branches: [ clustering ]
    paths:
      - 'sql/pending_updates/*.sql'
      - 'sql/pending_updates/**/*.sql'
      - 'sql/updates/**/*.sql'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/clustering'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.AUTOMATION_PAT || github.token }}

      - name: Test SQL reconciliation and promotion
        shell: pwsh
        run: |
          python tools/dev/tests/reconcile_sql_updates.test.py
          if ($LASTEXITCODE -ne 0) { throw 'SQL reconciliation tests failed.' }
          ./tools/dev/tests/promote_pending_updates.test.ps1

      - name: Import and commit pending SQL
        id: import-pending
        shell: pwsh
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not refresh clustering branch.' }

          python ./tools/dev/reconcile_sql_updates.py --base-ref "$env:SQL_BASE_REF" --apply
          if ($LASTEXITCODE -ne 0) { throw 'SQL collision reconciliation failed.' }

          $pendingFiles = Get-ChildItem -Path sql/pending_updates -Filter *.sql -File -Recurse
          $invalidFiles = @()
          foreach ($file in $pendingFiles) {
            $relativePath = $file.FullName.Substring((Get-Location).Path.Length + 1).Replace('\', '/')
            $relativeParts = $relativePath.Split('/')
            $databaseName = if ($relativeParts.Count -ge 3) { $relativeParts[2] } else { '' }

            if ($relativeParts.Count -ne 4 -or $relativeParts[0] -ne 'sql' -or $relativeParts[1] -ne 'pending_updates' -or $databaseName -notin @('auth', 'characters', 'world', 'hub')) {
              $invalidFiles += $relativePath
            }
          }

          if ($invalidFiles.Count -gt 0) {
            Write-Error ("Pending SQL files must live directly under sql/pending_updates/<database>. The promotion script assigns official YYYY_MM_DD_<database>_NN.sql filenames. Invalid file(s):`n" + ($invalidFiles -join "`n"))
          }

          ./tools/dev/promote_pending_updates.ps1 -Apply
          git add -A sql/pending_updates sql/updates

          $changes = git diff --cached --name-only
          $status = $changes -join "`n"
          Write-Host $status

          if ([string]::IsNullOrWhiteSpace($status)) {
            Write-Host "No pending SQL changes to commit."
            "has_changes=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git commit -m "SQL: Promote pending updates" -m "Referenced commit(s): $env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit SQL promotion.' }
          "has_changes=true" >> $env:GITHUB_OUTPUT
        env:
          SQL_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || github.event.before }}

      - name: Push promoted SQL
        if: steps.import-pending.outputs.has_changes == 'true'
        shell: pwsh
        run: git push origin HEAD:${{ github.ref_name }}
