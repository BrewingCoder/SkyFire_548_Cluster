name: windows-cluster-build

on:
  workflow_dispatch:
  push:
    branches: [ clustering, main, trunk ]
  pull_request:
    branches: [ clustering, main, trunk ]
      
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  BUILD_TYPE: Release
  BOOST_VERSION: 1.91.0
  BOOST_ROOT: C:\local\boost_1_91_0
  OPENSSL_VERSION: 4.0.2
  OPENSSL_ROOT_DIR: C:\Program Files\OpenSSL
  OPENSSL_MODULES: C:\Program Files\OpenSSL\bin
  OPENSSL_LIB_LEGACY: C:\Program Files\OpenSSL\lib\VC\x64\MD\liblegacy.lib
  REPO_DIR: ${{ github.workspace }}
  BUILD_DIR: ${{ github.workspace }}\bin\builddir
  INSTALL_DIR: ${{ github.workspace }}\artifacts\cluster-windows
    
jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check game source tabs
      shell: pwsh
      run: ./tools/dev/game_metrics.ps1 -CheckNoTabs

    - name: Create Build Environment
      shell: pwsh
      run: |
        cmake -E make_directory ${{ env.BUILD_DIR }}

    - name: windows dependencies
      shell: pwsh
      run: |
        function Install-ChocoPackage {
          param(
            [Parameter(Mandatory = $true)]
            [string] $PackageName,
            [string[]] $PackageArgs = @()
          )

          for ($attempt = 1; $attempt -le 3; ++$attempt) {
            choco install -y $PackageName @PackageArgs --no-progress
            if ($LASTEXITCODE -eq 0) {
              return
            }

            if ($attempt -eq 3) {
              exit $LASTEXITCODE
            }

            Start-Sleep -Seconds (30 * $attempt)
          }
        }

        Install-ChocoPackage -PackageName make
        Install-ChocoPackage -PackageName cmake -PackageArgs @("--pre")
        Install-ChocoPackage -PackageName openssl -PackageArgs @("--version=$env:OPENSSL_VERSION")

    - name: Cache Boost
      id: boost-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.BOOST_ROOT }}
        key: boost-${{ env.BOOST_VERSION }}-windows

    - name: Install Boost
      if: steps.boost-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $boostSource = Join-Path $env:RUNNER_TEMP "boost_1_91_0"
        $boostArchive = Join-Path $env:RUNNER_TEMP "boost_1_91_0.7z"
        Invoke-WebRequest -Uri "https://archives.boost.io/release/$env:BOOST_VERSION/source/boost_1_91_0.7z" -OutFile $boostArchive
        7z x $boostArchive "-o$env:RUNNER_TEMP" -y
        Push-Location $boostSource
        try {
          .\bootstrap.bat
          .\b2.exe install --prefix="$env:BOOST_ROOT" --with-headers -j2
        } finally {
          Pop-Location
        }

    - name: windows configure with PCH
      shell: pwsh
      run: |
        cmake -S "$env:GITHUB_WORKSPACE" -B "$env:BUILD_DIR" `
          -A x64 `
          -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR" `
          -DSERVERS=ON `
          -DTOOLS=ON `
          -DPACKET_LOG_SERVER=ON `
          -DUSE_COREPCH=ON `
          -DUSE_SCRIPTPCH=ON `
          -DSKYFIRE_BUILD_TESTS=OFF `
          -DBOOST_ROOT="$env:BOOST_ROOT" `
          -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"

    - name: windows build with PCH
      shell: pwsh
      run: |
        cmake --build "$env:BUILD_DIR" --config "$env:BUILD_TYPE" --parallel 4

    - name: Install and verify clustering package
      shell: pwsh
      run: |
        cmake --install "$env:BUILD_DIR" --config "$env:BUILD_TYPE"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake "-DINSTALL_ROOT=$env:INSTALL_DIR" -DPACKAGE_PLATFORM=windows -P tools/ci/verify_cluster_install.cmake
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Windows clustering package
      uses: actions/upload-artifact@v4
      with:
        name: SkyFire_548_Cluster-windows-${{ github.sha }}
        path: ${{ env.INSTALL_DIR }}/
        if-no-files-found: error
        retention-days: 7
